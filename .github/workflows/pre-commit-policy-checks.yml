name: Pre-commit Policy Checks

on:
  # Policy checks run only for pull requests targeting main; release-branch
  # (cnv-4.x) PRs are intentionally not enforced by this workflow.
  pull_request:
    branches:
      - main

  # Manual dispatch: the staged-diff tier cannot be reproduced outside a
  # pull request (on main the staged diff is empty, so the staged-only
  # hooks would pass vacuously), so dispatch runs only the stateless
  # whole-file hooks. pre-commit.ci already enforces those on every push;
  # dispatch exists for manual smoke runs of that tier.
  workflow_dispatch:

# Cancel superseded runs on rapid iterative pushes.
concurrency:
  group: policy-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-checks:
    name: Run policy hooks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # uv tool install is the uv-managed mechanism for running pre-commit,
      # which is not a project dependency (the policy hooks must not depend
      # on the project environment).
      - name: Install pre-commit
        run: uv tool install pre-commit

      # The staged-diff hooks need the project environment; the stateless
      # dispatch tier does not, so both environment setup and staging are
      # limited to pull_request events.
      - name: Sync project environment
        if: github.event_name == 'pull_request'
        run: uv sync --locked

      # Stage the pull request diff: the merge base of main and HEAD, so
      # the staged index equals the pull request changes and the staged
      # hooks run with their exact local semantics. checkout@v7 with
      # fetch-depth: 0 already provides origin/main.
      - name: Stage the pull request diff
        if: github.event_name == 'pull_request'
        run: |
          BASE_SHA="$(git merge-base origin/main HEAD)"
          git reset --soft "${BASE_SHA}"
          echo "Policy checks run against the staged diff versus ${BASE_SHA}:"
          git diff --cached --stat

      - name: Run policy checks
        env:
          # The default token can read the public design-docs repository
          # that check-stp-links verifies STP references against.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            hook_ids=(check-banned-paths check-banned-constructs)
          else
            # Keep this list in sync with the ci: skip section of
            # .pre-commit-config.yaml (the staged-diff hooks pre-commit.ci
            # cannot run) plus the stateless check-banned-* hooks.
            hook_ids=(check-banned-paths check-banned-constructs check-staged-paths check-linter-directives check-python-source check-test-std check-stp-links)
          fi
          for hook_id in "${hook_ids[@]}"; do
            pre-commit run "${hook_id}" --all-files
          done
